<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let aleatorio1 = Math.floor(Math.random() * 10) + 1;

for (let i = 10; i > 0; i--) { 
    let numeroUsuario = parseInt(prompt(`Intentos: ${i}. Adivina el número (1-10):`));

    if (numeroUsuario === aleatorio1) {
        console.log("¡GANASTE!");
        break; 
    } else if (numeroUsuario > aleatorio1) {
        console.log("El número secreto es MENOR");
    } else {
        console.log("El número secreto es MAYOR");
    }

    if (i === 1) {
        console.log("Perdiste, el número era " + aleatorio1);
    }
}





    </script>
    
</body>
</html>
